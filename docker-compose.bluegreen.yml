# ==============================================================================
# 🐳 RDV-HUB SAAS -- DOCKER COMPOSE BLUE/GREEN (DÉPLOIEMENT SANS COUPURE)
# Orchestration à deux créneaux applicatifs (Blue: 8081 / Green: 8082)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. SLOT BLUE (APPLICATION WEB SAAS - PORT TEST 8081)
  # ----------------------------------------------------------------------------
  rdv-app-blue:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: rdv_hub_web_app_blue
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_SLOT=blue
      - DEFAULT_GOOGLE_EMAIL=${DEFAULT_GOOGLE_EMAIL:-sebastien.pro@gmail.com}
      - WAZE_BASE_URL=${WAZE_BASE_URL:-https://waze.com/ul}
    volumes:
      - rdv_data:/usr/share/nginx/html/data:rw
      - ./data:/usr/share/nginx/html/data:rw
    networks:
      rdv-internal-network:
        aliases:
          - rdv-app-blue
          - rdv_hub_web_app_blue
    ports:
      - "127.0.0.1:8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ----------------------------------------------------------------------------
  # 2. SLOT GREEN (APPLICATION WEB SAAS - PORT TEST 8082)
  # ----------------------------------------------------------------------------
  rdv-app-green:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: rdv_hub_web_app_green
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_SLOT=green
      - DEFAULT_GOOGLE_EMAIL=${DEFAULT_GOOGLE_EMAIL:-sebastien.pro@gmail.com}
      - WAZE_BASE_URL=${WAZE_BASE_URL:-https://waze.com/ul}
    volumes:
      - rdv_data:/usr/share/nginx/html/data:rw
      - ./data:/usr/share/nginx/html/data:rw
    networks:
      rdv-internal-network:
        aliases:
          - rdv-app-green
          - rdv_hub_web_app_green
    ports:
      - "127.0.0.1:8082:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ----------------------------------------------------------------------------
  # 3. REVERSE PROXY NGINX (PASSERELLE DE ROUTAGE DYNAMIQUE & ZERO-DOWNTIME RELOAD)
  # ----------------------------------------------------------------------------
  rdv-proxy:
    image: nginx:1.27-alpine
    container_name: rdv_hub_reverse_proxy
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8092}:80"
    volumes:
      - ./docker/proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/proxy/default.conf:/etc/nginx/conf.d/default.conf:rw
      - rdv_proxy_logs:/var/log/nginx:rw
      - ./docker/logs:/var/log/nginx:rw
    networks:
      - rdv-internal-network

networks:
  rdv-internal-network:
    name: rdv_internal_net
    driver: bridge

volumes:
  rdv_data:
    name: rdv_hub_data_volume
  rdv_proxy_logs:
    name: rdv_hub_proxy_logs
