# ==============================================================================
# RDV-HUB SAAS -- CONFIGURATION INTERNE DU CONTENEUR WEB APP (PORT 8080)
# ==============================================================================

server {
    listen 8080;
    server_name localhost;

    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # Point de controle de sante interne basique
    location /healthz {
        access_log off;
        default_type text/plain;
        return 200 "OK";
    }

    # Endpoint d'etat de sante temps reel approfondi (UptimeRobot / Moniteurs externes)
    location ~* ^/(api/health|health\.json)$ {
        alias /usr/share/nginx/html/data/health.json;
        default_type application/json;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Access-Control-Allow-Origin "*";
    }

    # API REST & WebSocket/SSE Rendez-vous (Proxy vers backend applicatif)
    location /api/appointments {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 86400s;
    }

    # Service Worker -- Ne jamais mettre en cache agressive pour garantir les MAJ PWA
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Manifest PWA
    location = /manifest.webmanifest {
        add_header Content-Type "application/manifest+json";
        add_header Cache-Control "public, max-age=3600";
    }

    # Assets statiques avec mise en cache raisonnee
    location ~* \.(css|js|svg|png|jpg|jpeg|ico|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # Donnees echantillons JSON et CSV
    location /data/ {
        add_header Cache-Control "no-cache";
    }

    # Fallback pour Single Page Application (SPA / PWA)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
