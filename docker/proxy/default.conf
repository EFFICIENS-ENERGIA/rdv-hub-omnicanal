# ==============================================================================
# RDV-HUB SAAS -- VIRTUALHOST DU REVERSE PROXY NGINX (SECTORISE & HARDENED)
# ==============================================================================

upstream rdv_app_backend {
    server rdv_hub_web_app_blue:8080 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    server_name localhost;

    # Masquage signature serveur
    server_tokens off;

    # En-tetes de Securite HTTP Renforces (Conformite OWASP / Google Security)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' https://waze.com https://*.waze.com https://calendar.google.com https://mail.google.com https://*.supabase.co wss://*.supabase.co https://cdn.jsdelivr.net https://unpkg.com data: blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co data: blob:; frame-ancestors 'self';" always;

    # Challenge ACME Let's Encrypt / Certbot (Sans redirection pour renouvellement SSL transparent)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Point de controle de sante pour Docker Compose Healthcheck
    location /healthz {
        access_log off;
        default_type text/plain;
        return 200 "OK";
    }

    # Endpoint de surveillance de sante temps reel (UptimeRobot / Datadog)
    location ~* ^/(api/health|health\.json)$ {
        proxy_pass http://rdv_app_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Access-Control-Allow-Origin "*";
    }

    # RATE LIMITING STRICT SUR LES ENDPOINTS DE RESERVATION (ANTI-SPAM / ANTI-BRUTE-FORCE)
    location ~* ^/(api/appointments|api/bookings|booking|rdv|inquiry|submit) {
        limit_req zone=booking_limit burst=5 nodelay;

        proxy_pass http://rdv_app_backend;
        proxy_http_version 1.1;

        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Proxy vers l'application Web interne avec Rate Limiting general
    location / {
        limit_req zone=general_limit burst=30 nodelay;

        proxy_pass http://rdv_app_backend;
        proxy_http_version 1.1;

        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts de resilience
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 8k;
    }

    # Page d'erreur personnalisee lors d'un depassement de rate limit (HTTP 429)
    error_page 429 = @rate_limited;
    location @rate_limited {
        default_type application/json;
        return 429 '{"error":"Trop de requêtes","message":"Vous avez dépassé le quota de requêtes autorisées. Veuillez patienter quelques instants."}';
    }

    # Pages d'erreur standard
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
