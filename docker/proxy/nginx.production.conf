# ==============================================================================
# 🛡️ RDV-HUB SAAS -- CONFIGURATION NGINX COMPLETE DE PRODUCTION (GRADE A+ SSL)
# Redirection HTTPS, Let's Encrypt / Certbot, En-tetes OWASP & Rate Limiting
# ==============================================================================

user  nginx;
worker_processes  auto;
pid   /var/run/nginx.pid;

error_log  /var/log/nginx/error.log warn;

events {
    worker_connections  2048;
    multi_accept        on;
    use                 epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 1. Masquage de la signature du serveur (Securite OWASP)
    server_tokens off;

    # Format de journalisation detaille avec temps de reponse
    log_format production_format '$remote_addr - $remote_user [$time_local] "$request" '
                                 '$status $body_bytes_sent "$http_referer" '
                                 '"$http_user_agent" "$http_x_forwarded_for" '
                                 'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log  /var/log/nginx/access.log production_format;

    # 2. Performance et I/O reseau
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Protection contre les requetes lentes & depassement de buffer
    client_max_body_size        25M;
    client_body_buffer_size     128k;
    client_header_buffer_size   4k;
    large_client_header_buffers 4 16k;

    # 3. Compression GZIP haute performance
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # 4. LIMITATION DU DEBIT (RATE LIMITING ANTI-SPAM & ANTI-BRUTE-FORCE)
    # Zone generale : 15 requetes/seconde par adresse IP (10 Mo stocke ~160 000 adresses IP)
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=15r/s;

    # Zone stricte reservations : 2 requetes/seconde pour empecher le flood et les robots
    limit_req_zone $binary_remote_addr zone=booking_limit:10m rate=2r/s;

    # Code HTTP renvoye lors d'un depassement de quota (Conforme RFC 6585)
    limit_req_status 429;

    # 5. Upstream vers le conteneur applicatif Web interne
    upstream rdv_app_backend {
        server rdv_hub_web_app_blue:8080 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # --------------------------------------------------------------------------
    # BLOC SERVEUR 1 : HTTP (PORT 80) -- DEFI LET'S ENCRYPT & REDIRECTION HTTPS
    # --------------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Masquage signature
        server_tokens off;

        # Challenge ACME Let's Encrypt / Certbot (Sans redirection)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri =404;
        }

        # Redirection permanente (301) de tout le trafic HTTP vers HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --------------------------------------------------------------------------
    # BLOC SERVEUR 2 : HTTPS (PORT 443) -- PRODUCTION SSL/TLS HARDENED
    # --------------------------------------------------------------------------
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name _;

        server_tokens off;

        # Certificats SSL/TLS Let's Encrypt (ou certificat de production)
        ssl_certificate     /etc/letsencrypt/live/rdv-hub/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/rdv-hub/privkey.pem;

        # Protocoles Modernes Securises (Bannissement SSLv3, TLS 1.0, TLS 1.1)
        ssl_protocols TLSv1.2 TLSv1.3;

        # Suites de chiffrement fortes Mozilla Intermediate Profile
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers off;

        # Cache de session SSL pour des connexions ultra-rapides
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # OCSP Stapling (Validation instantanee du certificat par les navigateurs)
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 1.1.1.1 8.8.8.8 valid=300s;
        resolver_timeout 5s;

        # EN-TETES DE SECURITE HTTP OWASP & GOOGLE SECURITY ESSENTIALS
        # HSTS (Strict-Transport-Security) : 1 an, force le navigateur en HTTPS
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # Protection contre l'usurpation de type MIME
        add_header X-Content-Type-Options "nosniff" always;

        # Protection anti-clickjacking (Interdit l'inclusion en iframe malveillante)
        add_header X-Frame-Options "SAMEORIGIN" always;

        # Protection anti-XSS heritee des navigateurs
        add_header X-XSS-Protection "1; mode=block" always;

        # Politique de confidentialite sur le Referer
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Restrictions materielles (Desactivation micro, camera et geolocalisation invasive)
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # Content-Security-Policy (CSP) adapte aux modules RDV-Hub (Waze, Google Calendar, Gmail, Supabase Cloud)
        add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' https://waze.com https://*.waze.com https://calendar.google.com https://mail.google.com https://*.supabase.co wss://*.supabase.co https://cdn.jsdelivr.net https://unpkg.com data: blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co data: blob:; frame-ancestors 'self';" always;

        # Verification de sante (Healthcheck Docker basique)
        location /healthz {
            access_log off;
            default_type text/plain;
            return 200 "OK";
        }

        # Surveillance de sante temps reel approfondie (UptimeRobot / Datadog)
        location ~* ^/(api/health|health\.json)$ {
            proxy_pass http://rdv_app_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Access-Control-Allow-Origin "*";
        }

        # ENDPOINTS SENSIBLES DE RESERVATION & PRISE DE RENDEZ-VOUS (RATE LIMITING RENFORCE)
        # Protege contre le spam, le scraping et les attaques par brute force
        location ~* ^/(api/appointments|api/bookings|booking|rdv|inquiry|submit) {
            limit_req zone=booking_limit burst=5 nodelay;

            proxy_pass http://rdv_app_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # ROUTE GENERALE (APPLICATION SAAS PWA)
        location / {
            limit_req zone=general_limit burst=30 nodelay;

            proxy_pass http://rdv_app_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            proxy_buffering on;
            proxy_buffer_size 8k;
            proxy_buffers 8 8k;
        }

        # Page d'erreur personnalisee lors d'un depassement de quota (HTTP 429)
        error_page 429 = @rate_limited;
        location @rate_limited {
            default_type application/json;
            return 429 '{"error":"Trop de requetes (Rate Limit)","message":"Vous avez depasse le nombre de requetes autorisees. Veuillez patienter quelques secondes avant de renvoyer votre demande de rendez-vous."}';
        }

        # Pages d'erreur standard
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
