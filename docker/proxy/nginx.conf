# ==============================================================================
# RDV-HUB SAAS -- CONFIGURATION GLOBALE NGINX (REVERSE PROXY)
# ==============================================================================

user  nginx;
worker_processes  auto;
pid   /var/run/nginx.pid;

error_log  /var/log/nginx/error.log warn;

events {
    worker_connections  1024;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Masquage de la version du serveur (Securite OWASP)
    server_tokens off;

    # Format de journalisation structure
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    # Optimisation E/S reseau
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Limites de buffer (Protection contre depassement)
    client_max_body_size        25M;
    client_body_buffer_size     128k;

    # Compression GZIP native
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Limitation du debit des requetes (Rate Limiting anti-spam / anti-brute-force)
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=15r/s;
    limit_req_zone $binary_remote_addr zone=booking_limit:10m rate=2r/s;
    limit_req_status 429;

    # Inclusion des virtual hosts
    include /etc/nginx/conf.d/*.conf;
}
