# ==============================================================================
# 🛡️ RDV-HUB SAAS -- VIRTUALHOST HTTPS DE PRODUCTION (SSL LET'S ENCRYPT)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. SERVEUR HTTP (PORT 80) : ACME CHALLENGE & REDIRECTION HTTPS
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name _;

    server_tokens off;

    # Emplacement de validation pour Let's Encrypt / Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Redirection stricte 301 vers HTTPS pour tout le reste
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. SERVEUR HTTPS (PORT 443) : APPLICATION SAAS SECURISEE & RATE LIMITING
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    server_tokens off;

    # Certificats SSL/TLS Let's Encrypt
    ssl_certificate     /etc/letsencrypt/live/rdv-hub/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rdv-hub/privkey.pem;

    # Durcissement SSL (Mozilla Modern / Intermediate)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # EN-TETES DE SECURITE OWASP & GOOGLE
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' https://waze.com https://*.waze.com https://calendar.google.com https://mail.google.com https://*.supabase.co wss://*.supabase.co https://cdn.jsdelivr.net https://unpkg.com data: blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co data: blob:; frame-ancestors 'self';" always;

    # Healthcheck basique
    location /healthz {
        access_log off;
        default_type text/plain;
        return 200 "OK";
    }

    # Surveillance de sante temps reel approfondie (UptimeRobot / Datadog)
    location ~* ^/(api/health|health\.json)$ {
        proxy_pass http://rdv_app_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Access-Control-Allow-Origin "*";
    }

    # RATE LIMITING STRICT SUR LA PRISE DE RENDEZ-VOUS (2 req/s max, burst 5)
    location ~* ^/(api/appointments|api/bookings|booking|rdv|inquiry|submit) {
        limit_req zone=booking_limit burst=5 nodelay;

        proxy_pass http://rdv_app_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # ROUTE PRINCIPALE APPLICATION
    location / {
        limit_req zone=general_limit burst=30 nodelay;

        proxy_pass http://rdv_app_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 8k;
    }

    # Reponse JSON claire en cas de depassement de rate limit (429)
    error_page 429 = @rate_limited;
    location @rate_limited {
        default_type application/json;
        return 429 '{"error":"Trop de requêtes","message":"Quota de requêtes dépassé. Veuillez patienter quelques secondes."}';
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
